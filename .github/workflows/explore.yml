name: Exploration bet261

# Phase 1 du cahier des charges : ouvrir bet261 dans un vrai navigateur et
# enregistrer ce que le site charge (JSON, WebSockets, captures d'écran).
on:
  push:
    paths:
      - "tools/explore/**"
      - ".github/workflows/explore.yml"
  workflow_dispatch:
    inputs:
      extra_urls:
        description: "URL supplémentaires à visiter (séparées par des virgules)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer Playwright
        working-directory: tools/explore
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Explorer bet261
        working-directory: tools/explore
        env:
          EXTRA_URLS: ${{ github.event.inputs.extra_urls }}
        run: node explore.mjs ../../explore-out

      - name: Archiver
        if: always()
        run: tar czf explore-out.tgz explore-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explore-out
          path: explore-out.tgz

      - name: Publier les résultats (release « exploration »)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete exploration --yes --cleanup-tag || true
          gh release create exploration explore-out.tgz --target "${{ github.sha }}" --prerelease \
            --title "Exploration bet261 (run ${{ github.run_number }})" \
            --notes "Données brutes d'exploration (phase 1). Usage interne au projet."
          # Ancienne appli Android du premier projet, retirée à la demande
          gh release delete android-latest --yes --cleanup-tag || true
