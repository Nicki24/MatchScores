name: Appli Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Construire l'APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }} -PappUrl=https://match-scores.vercel.app

      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk MatchScores.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MatchScores-apk
          path: MatchScores.apk

      - name: Publier dans les Releases (android-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest MatchScores.apk \
            --target "${{ github.sha }}" \
            --title "MatchScores Android (build ${{ github.run_number }})" \
            --notes "Appli Android avec bulle flottante. Télécharge MatchScores.apk sur ton téléphone et installe-le."
